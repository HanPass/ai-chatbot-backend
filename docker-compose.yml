services:
  postgres:
    image: postgres:16
    container_name: ai-chatbot-postgres
    environment:
      POSTGRES_DB: ai_chatbot
      POSTGRES_USER: ai_chatbot
      POSTGRES_PASSWORD: ai_chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
