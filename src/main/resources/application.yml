server:
  port: ${PORT:8080}

spring:
  application:
    name: ai-chatbot-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_chatbot}
    username: ${DATABASE_USERNAME:ai_chatbot}
    password: ${DATABASE_PASSWORD:ai_chatbot}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

ai:
  provider:
    base-url: https://api.openai.com/v1
    api-key: ${OPENAI_API_KEY}
    model: gpt-4.1-mini
    timeout-seconds: 60

logging:
  level:
    com.hanpass.aichatbot: INFO
